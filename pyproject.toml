[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "waymark-core"
version = "0.2.0"
description = "Waymark call-to-address intelligence backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.18,<1",
  "uvicorn[standard]>=0.32,<1",
  "websockets>=14,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
waymark-benchmark = "app.benchmark:main"
waymark-benchmark-run = "app.benchmark_run:main"
waymark-infobip-setup = "app.infobip_setup:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
